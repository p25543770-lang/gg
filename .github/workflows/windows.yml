name: Windows camera app

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements-windows.txt
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PurpleCorners app.py
      - name: Smoke-test packaged application (no camera required)
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD\dist\PurpleCorners.exe" -ArgumentList '--self-test' -PassThru -RedirectStandardOutput test-out.txt -RedirectStandardError test-err.txt
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Self-test timed out'
          }
          if ($process.ExitCode -ne 0) {
            $detail = (Get-Content test-err.txt -Raw) -replace "`r?`n", ' | '
            Write-Output "::error::Self-test failed: exit code $($process.ExitCode). $detail"
            exit 1
          }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PurpleCorners-Windows-x64
          path: dist/PurpleCorners.exe
          if-no-files-found: error
          retention-days: 90
