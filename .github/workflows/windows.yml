name: Windows portable app
on:
  workflow_dispatch:
  push:
    branches: [main, arena/086343bf-gg]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Stereo-Space-Windows-x64
          path: release/*.exe
          if-no-files-found: error

  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Stereo-Space-Windows-x64
          path: release
      - name: Publish direct Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one Windows executable." >&2
            exit 1
          fi
          gh release create v1.1.0-windows "${files[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Stereo Space 1.1.0 — Windows x64" \
            --notes "Portable Windows x64 executable built and tested by GitHub Actions run $GITHUB_RUN_ID from commit $GITHUB_SHA. This build includes the combined live view ('Общий вид'): the two camera streams are geometrically merged into one frame with depth-aware parallax compensation, exposure matching and a smooth overlap seam; raw two-camera and depth/3D modes remain available. No Node.js or manual server required; the ONNX model and WASM are bundled for offline processing. Unsigned build: SmartScreen may warn. The automated test suite (geometry, coordinate transfer, hamster box transfer, overlap/depth failure handling, camera order, frame timing, disconnects, resource cleanup) runs in this workflow; a real merge on two physical cameras has not been validated in CI — verify it with your own hardware."
