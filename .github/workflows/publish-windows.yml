name: Publish Windows download
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest verified Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = gh run list --workflow "Windows portable app" --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if (-not $runId) { throw "No successful Windows build run found." }
          Write-Host "Downloading artifacts from run $runId"
          gh run download $runId --name Stereo-Space-Windows-x64 --dir release
      - name: Publish executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem release/*.exe).FullName
          $target = $env:GITHUB_SHA
          gh release create v1.1.0-windows $exe --target $target --title "Stereo Space 1.1.0 — Windows x64" --notes "Portable Windows x64 executable with the combined live view (Общий вид): geometric merging of two camera streams into one frame with depth-aware parallax compensation and exposure matching. Built and tested on Windows by GitHub Actions (latest successful 'Windows portable app' run). No Node.js or manual server required; ONNX model and WASM are bundled for offline processing. Unsigned build: SmartScreen may warn. The automated test suite covers geometry, coordinate transfer and failure paths; a real merge on two physical cameras has not been validated in CI — verify it with your own hardware."
